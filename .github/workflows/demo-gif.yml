name: Update demo GIF

on:
  push:
    branches: [main]
    paths:
      - poker.py
      - requirements.txt
      - media/*.py
      - media/requirements.txt
  workflow_dispatch:

concurrency:
  group: demo-gif
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            media/requirements.txt
      - run: pip install -r requirements.txt -r media/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
      - run: playwright install --with-deps chromium
      - run: python media/make_gif.py
      - name: Commit the new GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/demo.gif
          if ! git diff --cached --quiet; then
            git commit -m "Update demo GIF [skip ci]"
            git push
          fi
